<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eine wichtige Frage!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(135deg, #fff1f2, #fce7f3);
      font-family: Arial, sans-serif; color: #29212b;
    }
    .card {
      width: min(100%, 560px); padding: 32px 22px; text-align: center;
      background: rgba(255,255,255,.94); border-radius: 22px;
      box-shadow: 0 14px 45px rgba(130, 60, 90, .16);
    }
    h1 { font-size: clamp(22px, 5vw, 30px); margin: 0 0 22px; }
    .question { font-size: clamp(17px, 4vw, 21px); line-height: 1.5; margin-bottom: 28px; }
    .buttons {
      min-height: 100px; display: flex; flex-wrap: wrap; gap: 14px;
      align-items: center; justify-content: center; padding: 8px;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 20px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: font-size .18s ease, transform .18s ease;
    }
    #yes { background: #16a34a; color: white; }
    #no { background: #e5e7eb; color: #222; }
    .hint { margin-top: 22px; color: #6b5563; }
    #result { margin-top: 22px; font-size: 20px; font-weight: 700; color: #15803d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Eine wichtige Frage! ❤️</h1>
    <div class="question">Kann ich morgen zu Hause ausruhen und nicht zur Arbeit kommen?</div>
    <div class="buttons">
      <button id="yes" type="button">Ja klar</button>
      <button id="no" type="button">Ne</button>
    </div>
    <div class="hint" id="hint">Denk mal drüber nach! 😇</div>
    <div id="result" aria-live="polite"></div>
  </main>
  <script>
    let yesSize = 18;
    let noSize = 18;
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    const hint = document.getElementById('hint');
    const result = document.getElementById('result');

    no.addEventListener('click', () => {
      yesSize = Math.min(yesSize + 2, 48);
      noSize = Math.max(noSize - 2, 2);
      yes.style.fontSize = yesSize + 'px';
      no.style.fontSize = noSize + 'px';
      no.style.padding = `${Math.max(2, noSize * .65)}px ${Math.max(3, noSize)}px`;
      hint.textContent = 'Denk noch mal drüber nach! 😉';
    });

    yes.addEventListener('click', () => {
      result.textContent = 'Wow! Ich wusste, du bist ein guter Chef, Daniel :) ❤️';
      yes.textContent = 'Ja klar ❤️';
      hint.textContent = 'Danke, Daniel! 😄';
    });
  </script>
</body>
</html>
